name: Multi-OS Testing - Omkishan

on:
  push:
    branches:
      - master

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Print Ubuntu message
        run: echo "Testing on Ubuntu..."

      - name: Show OS info
        run: uname -a

      - name: Create test file
        run: echo "Ubuntu test by Omkishan" > test-ubuntu.txt

      - name: Display file contents
        run: cat test-ubuntu.txt

      - name: Finish message
        run: echo "Ubuntu tests completed"

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Print Windows message
        run: echo "Testing on Windows..."

      - name: Show OS info
        run: systeminfo

      - name: Create test file
        run: echo "Windows test by Omkishan" > test-windows.txt

      - name: Display file contents
        run: type test-windows.txt

      - name: Finish message
        run: echo "Windows tests completed"